# fly.toml app configuration file generated for book-in on 2026-04-21T10:50:10+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'book-in'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[env]
  UPLOAD_DIR = "/data/uploads"

[[mounts]]
  source = "book_in_uploads"
  destination = "/data/uploads"
  initial_size = "1gb"
