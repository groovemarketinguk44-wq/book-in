<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center px-4">

  <div class="max-w-sm w-full text-center">
    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
    </div>

    <h1 class="text-2xl font-bold mb-2">Booking confirmed!</h1>
    <p class="text-gray-500 text-sm mb-8" id="subtext">We'll see you soon.</p>

    <div class="bg-gray-50 rounded-2xl p-5 text-left space-y-3 mb-8">
      <div class="flex justify-between text-sm">
        <span class="text-gray-500">Name</span>
        <span id="confName" class="font-medium"></span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-gray-500">Service</span>
        <span id="confService" class="font-medium"></span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-gray-500">Date & Time</span>
        <span id="confTime" class="font-medium"></span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-gray-500">Email</span>
        <span id="confEmail" class="font-medium text-xs break-all"></span>
      </div>
    </div>

    <a id="bookAgainBtn" href="#" class="block w-full bg-gray-900 text-white py-3 rounded-xl text-sm font-semibold hover:bg-gray-700 transition">
      Book again
    </a>
    <p class="text-xs text-gray-400 mt-4">A confirmation email has been sent to you.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name') || '';
    const email = params.get('email') || '';
    const service = params.get('service') || '';
    const time = params.get('time') || '';
    const slug = params.get('slug') || '';

    document.getElementById('confName').textContent = name;
    document.getElementById('confService').textContent = service;
    document.getElementById('confEmail').textContent = email;

    if (time) {
      const d = new Date(time);
      document.getElementById('confTime').textContent = d.toLocaleString('en-GB', {
        weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
      });
    }

    if (slug) {
      document.getElementById('bookAgainBtn').href = `/book/${slug}`;
    }
  </script>
</body>
</html>
